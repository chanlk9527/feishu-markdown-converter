    :root {
      --paper: #f6f3ec;
      --ink: #1d2320;
      --muted: #66706b;
      --line: #d9d2c4;
      --panel: #fffdf7;
      --panel-2: #ebe4d6;
      --accent: #0d6b57;
      --accent-dark: #084b3d;
      --warn: #a55622;
      --shadow: 0 18px 50px rgba(47, 39, 24, 0.12);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(29, 35, 32, 0.035) 1px, transparent 1px) 0 0 / 36px 36px,
        linear-gradient(180deg, rgba(29, 35, 32, 0.025) 1px, transparent 1px) 0 0 / 36px 36px,
        var(--paper);
      font-family: ui-serif, Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
      letter-spacing: 0;
    }

    button,
    textarea,
    input,
    .paste-pad {
      font: inherit;
      letter-spacing: 0;
    }

    .shell {
      width: min(1440px, calc(100vw - 40px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 0 28px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: grid;
      gap: 4px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 54px);
      line-height: 0.96;
      font-weight: 800;
    }

    .tagline {
      margin: 0;
      color: var(--muted);
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }

    .top-tools {
      display: flex;
      flex-wrap: wrap;
      justify-content: end;
      align-items: center;
      gap: 10px;
    }

    .mode-switch {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 247, 0.72);
    }

    .mode-button {
      height: 34px;
      border: 0;
      border-radius: 6px;
      padding: 0 12px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      font-weight: 800;
    }

    .mode-button.active {
      color: #fff;
      background: var(--ink);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: end;
      gap: 8px;
    }

    .button {
      height: 40px;
      border: 1px solid var(--ink);
      border-radius: var(--radius);
      padding: 0 14px;
      color: var(--ink);
      background: var(--panel);
      cursor: pointer;
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      font-weight: 700;
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 4px 4px 0 rgba(29, 35, 32, 0.16);
    }

    .button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .button.primary {
      border-color: var(--accent-dark);
      color: #fff;
      background: var(--accent);
    }

    .button.ghost {
      border-color: var(--line);
      color: var(--muted);
      background: transparent;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      min-height: 0;
    }

    .pane {
      min-width: 0;
      min-height: 620px;
      display: grid;
      grid-template-rows: auto 1fr;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 247, 0.82);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .pane-head {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .pane-title {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: 14px;
      font-weight: 800;
    }

    .mark {
      width: 22px;
      height: 22px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 5px;
      background: var(--panel-2);
      font-size: 13px;
      line-height: 1;
      flex: 0 0 auto;
    }

    .meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .paste-pad {
      min-height: 0;
      padding: 24px;
      overflow: auto;
      outline: none;
      background: var(--panel);
      font-size: 17px;
      line-height: 1.72;
    }

    .paste-pad:focus {
      box-shadow: inset 0 0 0 2px rgba(13, 107, 87, 0.22);
    }

    .paste-pad[contenteditable="true"]:empty::before {
      content: "在这里粘贴飞书文档内容";
      color: #9b9283;
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .output {
      min-height: 0;
      width: 100%;
      resize: none;
      border: 0;
      outline: none;
      padding: 24px;
      color: #17211d;
      background: #fbfaf5;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 14px;
      line-height: 1.62;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .input-md {
      min-height: 0;
      width: 100%;
      resize: none;
      border: 0;
      outline: none;
      padding: 24px;
      color: #17211d;
      background: var(--panel);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 14px;
      line-height: 1.64;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .rendered-preview {
      background: #fffef9;
    }

    .rendered-preview h1,
    .rendered-preview h2,
    .rendered-preview h3 {
      line-height: 1.16;
      margin: 0 0 14px;
    }

    .rendered-preview h1 {
      font-size: 34px;
    }

    .rendered-preview h2 {
      font-size: 26px;
    }

    .rendered-preview h3 {
      font-size: 21px;
    }

    .rendered-preview p {
      margin: 0 0 12px;
    }

    .rendered-preview ul,
    .rendered-preview ol {
      margin: 0 0 14px 24px;
      padding: 0;
    }

    .rendered-preview li {
      margin: 4px 0;
    }

    .rendered-preview blockquote {
      margin: 0 0 14px;
      padding: 4px 0 4px 14px;
      border-left: 3px solid var(--accent);
      color: var(--muted);
    }

    .rendered-preview pre {
      overflow: auto;
      margin: 0 0 14px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f2eee4;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    .rendered-preview code {
      padding: 1px 4px;
      border-radius: 4px;
      background: #f2eee4;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.92em;
    }

    .rendered-preview pre code {
      padding: 0;
      background: transparent;
    }

    .rendered-preview table {
      width: 100%;
      margin: 0 0 14px;
      border-collapse: collapse;
      font-size: 15px;
    }

    .rendered-preview td {
      border: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }

    .rendered-preview tr:first-child td {
      background: #efe8db;
      font-weight: 800;
    }

    .hidden {
      display: none !important;
    }

    .status {
      min-height: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: var(--muted);
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
    }

    .status strong {
      color: var(--accent-dark);
    }

    .drop {
      position: fixed;
      inset: 12px;
      z-index: 10;
      display: none;
      place-items: center;
      border: 2px dashed var(--accent);
      border-radius: 14px;
      color: var(--accent-dark);
      background: rgba(246, 243, 236, 0.92);
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 24px;
      font-weight: 800;
    }

    body.dragging .drop {
      display: grid;
    }

    @media (max-width: 920px) {
      .shell {
        width: min(100vw - 24px, 760px);

      .topbar {
        align-items: start;

      .actions {
        width: 100%;

      }

      .top-tools {
        width: 100%;

      }

      .mode-switch {
        width: 100%;
      }

      .mode-button {
        flex: 1 1 50%;
      }

      .button {
        flex: 1 1 132px;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .pane {
        min-height: 460px;
      }

      h1 {
        font-size: 36px;
      }
    }

    /* Signal console theme */
    :root {
      color-scheme: dark;
      --paper: #070a10;
      --ink: #eef5ff;
      --muted: #8b99af;
      --line: rgba(148, 163, 184, 0.18);
      --panel: #0d141f;

      --accent: #65d7ff;
      --accent-dark: #38bdf8;
      --violet: #9b8cff;

      --mono-font: "Cascadia Code", "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
    }

    body {
      position: relative;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% -10%, rgba(55, 164, 255, 0.2), transparent 32%),
        radial-gradient(circle at 88% 0%, rgba(155, 140, 255, 0.15), transparent 30%),
        linear-gradient(rgba(111, 142, 177, 0.055) 1px, transparent 1px) 0 0 / 42px 42px,
        linear-gradient(90deg, rgba(111, 142, 177, 0.055) 1px, transparent 1px) 0 0 / 42px 42px,
        var(--paper);
      font-family: var(--body-font);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;
      height: 3px;
      pointer-events: none;
      background: linear-gradient(90deg, transparent 3%, var(--accent) 24%, var(--violet) 72%, transparent 97%);
      box-shadow: 0 0 24px rgba(101, 215, 255, 0.42);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(125deg, transparent 0 48%, rgba(101, 215, 255, 0.04) 48.1% 48.25%, transparent 48.35% 100%);
    }

    button,
    textarea,
    input,
    .paste-pad {
      font-family: var(--body-font);
    }

    button:focus-visible,
    textarea:focus-visible,
    [contenteditable="true"]:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;

    }

    .rendered-preview td {
      border: 0;
      border-right: 1px solid rgba(148, 163, 184, 0.14);
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      padding: 9px 11px;
    }

    .rendered-preview tr:first-child td {
      color: #e5edff;
      background: rgba(155, 140, 255, 0.12);
    }

    .rendered-preview tr:last-child td {
      border-bottom: 0;
    }

    .rendered-preview td:last-child {
      border-right: 0;
    }

    .flow-node {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 6;
      width: 72px;
      height: 44px;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .flow-beam {
      position: absolute;
      left: 4px;
      right: 4px;
      top: 50%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(101, 215, 255, 0.72), rgba(155, 140, 255, 0.72), transparent);
      box-shadow: 0 0 14px rgba(101, 215, 255, 0.38);
    }

    .flow-beam::after {
      content: "";
      position: absolute;
      top: -2px;
      left: 3px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 12px var(--accent), 0 0 24px var(--violet);
      animation: route-packet 2.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    .flow-core {
      position: relative;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(101, 215, 255, 0.34);
      border-radius: 50%;
      color: #ecf8ff;
      background: #0a111c;
      box-shadow: 0 0 0 5px rgba(7, 10, 16, 0.88), 0 0 24px rgba(101, 215, 255, 0.2);
      font-family: var(--mono-font);
      font-size: 15px;
      font-weight: 700;
    }

    .flow-core::before {
      content: "→";
    }

    body[data-mode="to-md"] .flow-core::before {
      content: "←";
    }

    body[data-mode="to-md"] .flow-beam::after {
      animation-direction: reverse;
    }

    .status {
      min-height: 38px;
      padding: 0 8px;
      color: #7f8da3;
      font-family: var(--body-font);
      font-size: 12px;
    }

    #statusText {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    #statusText::before {
      content: "";
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 10px rgba(113, 247, 193, 0.62);
    }

    .status strong {
      color: var(--accent);
    }

    .drop {
      inset: 18px;
      border-color: var(--accent);
      border-radius: 24px;
      color: #eaf8ff;
      background: rgba(7, 12, 20, 0.92);
      backdrop-filter: blur(24px);
      box-shadow: inset 0 0 80px rgba(101, 215, 255, 0.08);
      font-family: var(--display-font);
      letter-spacing: -0.02em;
    }

    @keyframes signal-pulse {
      0%, 100% { opacity: 0.58; transform: scale(0.82); }
      50% { opacity: 1; transform: scale(1); }
    }

    @keyframes route-packet {
      0% { transform: translateX(0); opacity: 0; }
      18% { opacity: 1; }
      82% { opacity: 1; }
      100% { transform: translateX(60px); opacity: 0; }
    }

    @media (max-width: 1120px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .top-tools,
      .actions {
        width: 100%;
        justify-content: flex-start;
      }
    }

    @media (max-width: 920px) {
      .shell {
        width: min(100vw - 24px, 760px);
        padding-top: 16px;
      }

      .topbar {
        padding: 17px;
        border-radius: 18px;
      }

      h1 {
        font-size: clamp(31px, 9vw, 48px);
      }

      .workspace {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .flow-node {
        display: none;
      }

      .pane {
        min-height: 480px;
      }

      .button {
        flex: 1 1 132px;
      }
    }

    @media (max-width: 560px) {

        width: calc(100vw - 16px);
        gap: 12px;
      }

      .topbar {
        padding: 15px;
      }

      .brand-kicker {
        font-size: 9px;
      }

      h1 {
        gap: 1px 8px;
      }

      .tagline {

      }

      .mode-switch {
        width: 100%;
      }

      .mode-button {
        flex: 1 1 50%;
        padding: 0 8px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .button {
        width: 100%;
        padding: 0 10px;
      }

      .pane-head {
        height: 56px;
        padding: 0 14px;
      }

      .paste-pad,
      .output,
      .input-md {
        padding: 19px;
      }

      .status {
        align-items: flex-start;
        flex-direction: column;
        padding: 4px 6px 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Glacier workstation palette */

    .feishu-icon {
      position: relative;

      height: 22px;

    .feishu-icon i {
      position: absolute;

    .feishu-icon i:nth-child(1) {
      top: 5px;

      background: #3370ff;
      transform: rotate(38deg);

    .feishu-icon i:nth-child(2) {
      top: 5px;
      right: 3px;
      background: #00b8d9;
      transform: rotate(-38deg);

    .feishu-icon i:nth-child(3) {
      bottom: 5px;
      left: 3px;
      background: #ff7d00;
      transform: rotate(-38deg);

    .feishu-icon i:nth-child(4) {

      background: #f54a45;

    .pane {
      border-color: rgba(54, 79, 121, 0.14);
      background: rgba(255, 255, 255, 0.9);

    .pane-input {

    .pane-title {
      color: #2c3b57;
    }

    .mark {
      border-color: color-mix(in srgb, var(--pane-accent) 50%, transparent);
      color: color-mix(in srgb, var(--pane-accent) 82%, #17233f);
      background: color-mix(in srgb, var(--pane-accent) 9%, white);
      box-shadow: inset 0 0 12px color-mix(in srgb, var(--pane-accent) 6%, transparent);

    .meta {
      border-color: rgba(54, 79, 121, 0.1);
      color: #748198;
      background: rgba(225, 237, 248, 0.56);
    }

    .paste-pad,
    .output,
    .input-md {
      color: #253550;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(244, 249, 253, 0.82));

      scrollbar-color: rgba(33, 137, 199, 0.28) transparent;
    }

    .paste-pad:focus {
      box-shadow: inset 0 0 0 1px rgba(33, 137, 199, 0.25), inset 0 0 34px rgba(33, 137, 199, 0.025);
    }

    .paste-pad[contenteditable="true"]:empty::before,
    textarea::placeholder {
      color: #98a5b7;
    }

    .rendered-preview {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(246, 250, 253, 0.9));
    }

    .rendered-preview h1,
    .rendered-preview h2,
    .rendered-preview h3 {
      color: #17233f;
    }

    .rendered-preview a {
      color: #167ab3;
    }

    .rendered-preview blockquote {
      border-color: var(--accent);
      color: #5f6e86;
      background: rgba(33, 137, 199, 0.045);
    }

    .rendered-preview pre {
      border-color: rgba(72, 93, 135, 0.16);
      color: #dce8f5;
      background: #18243a;
      box-shadow: inset 3px 0 0 rgba(255, 125, 102, 0.8), 0 10px 24px rgba(43, 61, 92, 0.12);
    }

    .rendered-preview code {
      color: #4e4b9c;
      background: rgba(98, 95, 201, 0.1);
    }

    .rendered-preview pre code {
      color: inherit;
      background: transparent;
    }

    .rendered-preview table {
      border-color: rgba(54, 79, 121, 0.14);
      background: rgba(255, 255, 255, 0.7);
    }

    .rendered-preview td {
      border-color: rgba(54, 79, 121, 0.11);
    }

    .rendered-preview tr:first-child td {
      color: #263654;
      background: rgba(33, 137, 199, 0.075);
    }

    .flow-beam {
      background: linear-gradient(90deg, transparent, rgba(33, 137, 199, 0.64), rgba(255, 125, 102, 0.58), transparent);
      box-shadow: 0 0 12px rgba(33, 137, 199, 0.22);
    }

    .flow-beam::after {
      background: #ffffff;
      box-shadow: 0 0 10px var(--accent), 0 0 20px #ff7d66;
    }

    .flow-core {
      border-color: rgba(33, 137, 199, 0.28);
      color: #176c9f;
      background: #ffffff;
      box-shadow: 0 0 0 5px rgba(238, 245, 251, 0.94), 0 8px 22px rgba(54, 79, 121, 0.17);
    }

    .status {
      color: #718097;
    }

    #statusText::before {
      background: var(--mint);
      box-shadow: 0 0 9px rgba(34, 173, 145, 0.42);
    }

    .status strong {
      color: var(--accent-dark);
    }

    .drop {
      border-color: var(--accent);
      color: #213354;
      background: rgba(241, 248, 253, 0.94);
      box-shadow: inset 0 0 80px rgba(33, 137, 199, 0.07);
    }

    /* Content courier mascots live outside both editing panes. */
    .shell {
      width: min(1760px, calc(100vw - 32px));
    }

    .workspace {
      grid-template-columns: clamp(118px, 9vw, 164px) minmax(0, 1fr) 36px minmax(0, 1fr) clamp(118px, 9vw, 164px);
      column-gap: 10px;
    }

    .pane-input {
      grid-column: 2;
    }

    .pane-output {
      grid-column: 4;
    }

    .mascot-stage {
      position: relative;
      align-self: center;
      width: 100%;
      aspect-ratio: 3 / 4;
      border: 1px solid rgba(91, 134, 205, 0.3);
      border-radius: 44% 44% 32% 32% / 25% 25% 18% 18%;
      background-image: url("assets/converter-mascots.png");
      background-repeat: no-repeat;
      background-size: 200% 100%;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 18px 34px rgba(42, 66, 112, 0.2);
      isolation: isolate;
      animation: mascot-hover 4.6s ease-in-out infinite;
    }

    .mascot-stage::before {
      content: "";
      position: absolute;
      inset: -8px;
      z-index: -1;
      border: 1px solid rgba(33, 137, 199, 0.12);
      border-radius: inherit;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.72), rgba(213, 233, 250, 0.34));
      box-shadow: 0 0 0 5px rgba(238, 245, 251, 0.7);
    }

    .mascot-stage::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 22px;
      height: 1px;
      background: linear-gradient(90deg, rgba(33, 137, 199, 0.1), rgba(33, 137, 199, 0.72));
      box-shadow: 0 0 10px rgba(33, 137, 199, 0.32);
    }

    .mascot-left {
      grid-column: 1;
      background-position: left center;
    }

    .mascot-left::after {
      right: -26px;
    }

    .mascot-right {
      grid-column: 5;
      background-position: right center;
      animation-delay: -2.3s;
    }

    .mascot-right::after {
      left: -26px;
      transform: scaleX(-1);
    }

    .mascot-caption {
      position: absolute;
      left: 50%;
      bottom: -34px;
      min-width: max-content;
      transform: translateX(-50%);
      padding: 6px 10px;
      border: 1px solid rgba(54, 79, 121, 0.13);
      border-radius: 999px;
      color: #415371;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 18px rgba(54, 79, 121, 0.1);
      font-family: var(--mono-font);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      white-space: nowrap;
      backdrop-filter: blur(10px);
    }

    .mascot-left .mascot-caption::before {
      content: "# ";
      color: var(--accent);
    }

    .mascot-right .mascot-caption::before {
      content: "✓ ";
      color: var(--mint);
    }

    .flow-node {
      grid-column: 3;
    }

    @keyframes mascot-hover {
      0%, 100% { transform: translateY(0) rotate(-0.4deg); }
      50% { transform: translateY(-8px) rotate(0.7deg); }
    }

    @media (max-width: 1240px) {
      .shell {
        width: min(100vw - 24px, 1120px);
      }

      .workspace {
        grid-template-columns: minmax(0, 1fr) 36px minmax(0, 1fr);
        column-gap: 10px;
      }

      .mascot-stage {
        display: none;
      }

      .pane-input {
        grid-column: 1;
      }

      .flow-node {
        grid-column: 2;
      }

      .pane-output {
        grid-column: 3;
      }
    }

    @media (max-width: 920px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .pane-input,
      .pane-output {
        grid-column: 1;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-kicker"><span class="signal-dot" aria-hidden="true"></span>LOCAL CONVERSION NODE</div>
        <h1><span>飞书文档</span><span class="route-glyph" aria-hidden="true">⇄</span><span>Markdown</span></h1>
        <p class="tagline">内容只在当前浏览器中转换 · 双向保留结构与格式</p>
      </div>
      <div class="top-tools">
        <div class="mode-switch" aria-label="转换方向">
          <button class="mode-button" type="button" data-mode="to-md">飞书 → MD</button>
          <button class="mode-button active" type="button" data-mode="to-feishu">MD → 飞书</button>
        </div>
        <div class="actions" aria-label="操作">
          <button class="button" id="readClipboard" type="button">读取 MD</button>
          <button class="button copy-action feishu-primary" id="copyMarkdown" type="button"><span class="feishu-icon" id="feishuIcon" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="copyButtonLabel">复制到飞书</span></button>
          <button class="button" id="downloadMarkdown" type="button">下载 .md</button>
          <button class="button ghost" id="clearAll" type="button">清空</button>
        </div>
      </div>
    </header>

    <section class="workspace" aria-label="转换工作区">
      <div class="mascot-stage mascot-left" aria-hidden="true"><span class="mascot-caption">内容打包中</span></div>

      <article class="pane pane-input">
        <div class="pane-head">
          <div class="pane-title"><span class="mark" id="inputMark">IN</span><span id="inputTitle">飞书粘贴区</span></div>
          <span class="meta" id="sourceMeta">等待粘贴</span>
        </div>
        <div class="paste-pad" id="pastePad" contenteditable="true" spellcheck="false" aria-label="粘贴飞书内容"></div>
        <textarea class="input-md hidden" id="markdownInput" spellcheck="false" aria-label="输入 Markdown"></textarea>
      </article>

      <div class="flow-node" aria-hidden="true"><span class="flow-beam"></span><span class="flow-core"></span></div>

      <article class="pane pane-output">
        <div class="pane-head">
          <div class="pane-title"><span class="mark" id="outputMark">MD</span><span id="outputTitle">Markdown 输出</span></div>
          <span class="meta" id="outputMeta">0 字</span>
        </div>
        <textarea class="output" id="markdownOutput" spellcheck="false" aria-label="Markdown 输出"></textarea>
        <div class="paste-pad rendered-preview hidden" id="feishuPreview" tabindex="0" aria-label="飞书富文本预览"></div>
      </article>

      <div class="mascot-stage mascot-right" aria-hidden="true"><span class="mascot-caption">准备接收</span></div>
    </section>

    <footer class="status">
      <span id="statusText">打开后即可离线使用。</span>
      <span>HTML / RTF / 纯文本</span>
    </footer>
  </main>
  <div class="drop" id="dropOverlay">放开导入 HTML 文件</div>

  <script>
    (function () {
      "use strict";

      const pastePad = document.getElementById("pastePad");
      const markdownInput = document.getElementById("markdownInput");
      const markdownOutput = document.getElementById("markdownOutput");
      const feishuPreview = document.getElementById("feishuPreview");
      const sourceMeta = document.getElementById("sourceMeta");
      const outputMeta = document.getElementById("outputMeta");

      const blockTags = new Set([

      function cleanInline(text) {

      }

      function styleOf(node) {
        const style = {};
        const raw = (node.getAttribute && node.getAttribute("style")) || "";
        raw.split(";").forEach((part) => {
          const index = part.indexOf(":");
          if (index === -1) return;
          style[part.slice(0, index).trim().toLowerCase()] = part.slice(index + 1).trim().toLowerCase();

      function isBold(node) {

      function isItalic(node) {

      function isStrike(node) {

      function renderInline(node) {

      function renderListItem(node, marker, indent) {

        function flushInline() {

      function collectRows(node) {

      function htmlToMarkdown(rawHtml) {

          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")

      function renderMarkdownInline(text) {
        const htmlTokens = [];
        function stash(html) {
          const token = "\u0000HTML" + htmlTokens.length + "\u0000";
          htmlTokens.push(html);
          return token;
        }

        let value = String(text || "").replace(/`([^`]+)`/g, (_, code) => {
          return stash("<code>" + escapeHtml(code) + "</code>");

        value = value.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (_, alt, src) => {

      function renderMarkdownTable(lines, index) {

      function renderMarkdownList(lines, index, baseIndent, ordered) {

            items[items.length - 1] += nested.html;
            cursor = nested.index;
            continue;

          if (match.indent !== baseIndent || match.ordered !== ordered) break;

          let itemText = match.text;
          let itemHtml = "";
          cursor += 1;

          const checked = /^\[[xX]\]\s+/.test(itemText);
          const unchecked = /^\[\s\]\s+/.test(itemText);

          itemHtml += renderMarkdownInline(itemText);

          while (cursor < lines.length) {

              break;
            }
            const nextMatch = markdownListMatch(line);
            if (nextMatch) {

                itemHtml += nested.html;
                cursor = nested.index;
                continue;

      function renderMarkdownBlocks(lines, start, end) {

            const code = [];
            index += 1;

          const listMatch = markdownListMatch(line);
          if (listMatch) {

            index = list.index;
            continue;

          const paragraph = [line.trim()];
          index += 1;

            index += 1;

      function randomUuid() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        const bytes = new Uint8Array(16);
        if (window.crypto && typeof window.crypto.getRandomValues === "function") {
          window.crypto.getRandomValues(bytes);
        } else {
          for (let index = 0; index < bytes.length; index += 1) {
            bytes[index] = Math.floor(Math.random() * 256);
          }
        }
        bytes[6] = (bytes[6] & 15) | 64;
        bytes[8] = (bytes[8] & 63) | 128;
        const hex = Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
        return [hex.slice(0, 8), hex.slice(8, 12), hex.slice(12, 16), hex.slice(16, 20), hex.slice(20)].join("-");
      }

      function larkRecordId(prefix) {

      function larkInlineRuns(node, inherited, output) {

        const tag = node.tagName.toLowerCase();
        if (tag === "br") {

          return runs;
        }
        if (tag === "input" && (node.getAttribute("type") || "").toLowerCase() === "checkbox") {
          runs.push({ text: node.checked || node.hasAttribute("checked") ? "☑ " : "☐ ", styles });
          return runs;
        }
        if (tag === "ul" || tag === "ol") return runs;

        const next = Object.assign({}, styles);
        if (tag === "strong" || tag === "b" || isBold(node)) next.bold = "true";
        if (tag === "em" || tag === "i" || isItalic(node)) next.italic = "true";
        if (tag === "s" || tag === "strike" || tag === "del" || isStrike(node)) next.strikethrough = "true";
        if (tag === "code") next.inlineCode = "true";
        if (tag === "a" && node.getAttribute("href")) next.link = encodeURIComponent(node.getAttribute("href"));
        Array.from(node.childNodes).forEach((child) => larkInlineRuns(child, next, runs));

      function larkAttributedText(node) {
        const rawRuns = larkInlineRuns(node, {}, []);

        rawRuns.forEach((run) => {
          if (!run.text) return;
          const key = JSON.stringify(run.styles);
          const previous = runs[runs.length - 1];
          if (previous && previous.key === key) {
            previous.text += run.text;
          } else {
            runs.push({ text: run.text, styles: run.styles, key });
          }
        });

        const numToAttrib = { 0: ["author", "0"] };
        const attributeNumbers = new Map();
        let nextNum = 1;
        let text = "";
        let attribs = "";

        runs.forEach((run) => {
          text += run.text;
          let marks = "*0";
          Object.keys(run.styles).sort().forEach((name) => {
            const value = run.styles[name];
            const attributeKey = name + "\u0000" + value;
            if (!attributeNumbers.has(attributeKey)) {
              attributeNumbers.set(attributeKey, nextNum);
              numToAttrib[nextNum] = [name, value];
              nextNum += 1;
            }
            marks += "*" + attributeNumbers.get(attributeKey).toString(36);
          });
          attribs += marks + "+" + run.text.length.toString(36);
        });

        if (!text) {
          return {
            text: { 0: "" },
            attribs: { 0: "" },
            apool: { numToAttrib: {}, nextNum: 0 }
          };
        }
        return {
          text: { 0: text },
          attribs: { 0: attribs },
          apool: { numToAttrib, nextNum }
        };
      }

      function buildLarkClipboardPayload() {

        const selection = [];
        let selectionId = 1;

        function addRecord(id, snapshot) {
          recordMap[id] = { id, snapshot };
        }

        function addTopLevelSelection(recordId, type, textLength) {
          const id = selectionId;
          selectionId += 1;
          recordIds.push(recordId);
          blockIds.push(id);
          if (type === "block") {
            selection.push({ id, type: "block", recordId });
          } else {
            selection.push({ id, type: "text", selection: { start: 0, end: textLength || 0 }, recordId });
          }
        }

        function createTextRecord(node, type, options) {
          const settings = options || {};
          const id = larkRecordId("blk");
          const attributed = larkAttributedText(node);
          const value = attributed.text[0] || "";
          const snapshot = {
            type: type || "text",
            parent_id: rootId,
            comments: [],
            revisions: [],
            locked: false,
            hidden: false,
            author,
            children: [],
            text: {
              initialAttributedTexts: { text: attributed.text, attribs: attributed.attribs },
              apool: attributed.apool
            },
            align: "left",
            folded: false
          };
          if (/^heading\d$/.test(snapshot.type)) {
            snapshot.seq = "auto";
            snapshot.seq_level = "auto";
          }
          if (snapshot.type === "bullet" || snapshot.type === "ordered") {
            snapshot.level = settings.level || 1;
          }
          if (snapshot.type === "ordered") snapshot.seq = "auto";
          if (snapshot.type === "code") {
            snapshot.language = settings.language || 1;
            snapshot.wrap = true;
          }
          addRecord(id, snapshot);
          addTopLevelSelection(id, "text", value.length);
          return id;
        }

        function createPlainTextRecord(text, type, options) {
          const node = document.createElement("span");
          node.textContent = text || "";
          return createTextRecord(node, type || "text", options);
        }

        function larkCodeLanguage(node) {
          const code = node.querySelector("code");
          const language = ((code && code.dataset.language) || "").trim().toLowerCase();
          const languageIds = {
            bash: 7,
            sh: 7,
            shell: 7,
            go: 22,
            golang: 22,
            java: 29,
            javascript: 30,
            js: 30,
            python: 49,
            py: 49,
            rust: 53,
            sql: 56,
            typescript: 63,
            ts: 63,
            yaml: 67,
            yml: 67
          };
          return languageIds[language] || 1;
        }

        function createListRecords(list, level) {
          const type = list.tagName.toLowerCase() === "ol" ? "ordered" : "bullet";
          Array.from(list.children).forEach((item) => {
            if (item.tagName.toLowerCase() !== "li") return;
            const inline = item.cloneNode(true);
            inline.querySelectorAll("ul,ol").forEach((nested) => nested.remove());
            createTextRecord(inline, type, { level });
            Array.from(item.children).forEach((child) => {
              const childTag = child.tagName.toLowerCase();
              if (childTag === "ul" || childTag === "ol") createListRecords(child, level + 1);
            });
          });
        }

        function createTableRecord(table) {
          const rows = Array.from(table.rows);
          const columnCount = Math.max(...rows.map((row) => row.cells.length), 1);
          const tableId = larkRecordId("tbl");
          const columnIds = Array.from({ length: columnCount }, () => "col" + randomUuid());
          const rowIds = rows.map(() => "row" + randomUuid());
          const columnSet = {};
          const cellSet = {};
          const cellIds = [];
          columnIds.forEach((id) => { columnSet[id] = { column_width: 200 }; });

          rows.forEach((row, rowIndex) => {
            for (let columnIndex = 0; columnIndex < columnCount; columnIndex += 1) {
              const sourceCell = row.cells[columnIndex];
              const cellId = larkRecordId("cel");
              const textId = larkRecordId("txt");
              const attributed = larkAttributedText(sourceCell || document.createElement("span"));
              cellIds.push(cellId);
              cellSet[rowIds[rowIndex] + columnIds[columnIndex]] = {
                merge_info: { row_span: 1, col_span: 1 },
                block_id: cellId
              };
              addRecord(cellId, {
                type: "table_cell",
                parent_id: tableId,
                comments: [],
                revisions: [],
                locked: false,
                hidden: false,
                author,
                children: [textId],
                vertical_align: "top"
              });
              addRecord(textId, {
                type: "text",
                parent_id: cellId,
                comments: [],
                revisions: [],
                locked: false,
                hidden: false,
                author,
                children: [],
                text: {
                  initialAttributedTexts: { text: attributed.text, attribs: attributed.attribs },
                  apool: attributed.apool
                },
                align: "left",
                folded: false
              });
            }
          });

          addRecord(tableId, {
            type: "table",
            parent_id: rootId,
            comments: [],
            revisions: [],
            locked: false,
            hidden: false,
            author,
            columns_id: columnIds,
            rows_id: rowIds,
            column_set: columnSet,
            cell_set: cellSet,
            children: cellIds
          });
          addTopLevelSelection(tableId, "block");
        }

        Array.from(feishuPreview.children).forEach((node) => {
          const tag = node.tagName.toLowerCase();
          if (tag === "table") {
            createTableRecord(node);
          } else if (/^h[1-6]$/.test(tag)) {
            createTextRecord(node, "heading" + tag.slice(1));
          } else if (tag === "ul" || tag === "ol") {
            createListRecords(node, 1);
          } else if (tag === "blockquote") {
            createTextRecord(node, "quote");
          } else if (tag === "pre") {
            createPlainTextRecord(node.textContent || "", "code", { language: larkCodeLanguage(node) });
          } else if (tag === "hr") {
            createPlainTextRecord("——", "text");
          } else {
            createTextRecord(node, "text");
          }
        });

        const emptyTitle = {
          initialAttributedTexts: { text: { 0: "" }, attribs: { 0: "" } },
          apool: { numToAttrib: {}, nextNum: 0 }
        };
        addRecord(rootId, {
          type: "page",
          parent_id: "",
          comments: null,
          revisions: [],
          locked: false,
          hidden: false,
          author,
          children: recordIds.slice(),
          text: emptyTitle,
          align: ""
        });

        const pasteFlag = randomUuid();
        const record = {
          isCut: false,
          rootId,
          parentId: rootId,
          blockIds,
          recordIds,
          recordMap,
          payloadMap,
          extra: {
            channel: "saas",
            pasteRandomId: randomUuid(),
            mention_page_title: {},
            external_mention_url: {}
          },
          isKeepQuoteContainer: false,
          selection,
          pasteFlag
        };
        const wrapper = document.createElement("div");
        wrapper.setAttribute("data-lark-html-role", "root");
        wrapper.setAttribute("data-docx-has-block-data", "false");
        wrapper.innerHTML = feishuPreview.innerHTML;
        wrapper.querySelectorAll("table").forEach((table) => {
          const rows = Array.from(table.rows);
          const columnCount = Math.max(...rows.map((row) => row.cells.length), 1);
          table.classList.add("ace-table");
          table.setAttribute("data-ace-table-col-widths", Array(columnCount).fill("200").join(";"));
          table.setAttribute("style", "border:none;border-collapse:collapse;table-layout:fixed;width:" + (columnCount * 200) + "px;");
          const colgroup = document.createElement("colgroup");
          for (let index = 0; index < columnCount; index += 1) {
            const col = document.createElement("col");
            col.setAttribute("width", "200");
            colgroup.appendChild(col);
          }
          table.insertBefore(colgroup, table.firstChild);
          rows.forEach((row) => {
            Array.from(row.cells).forEach((cell) => {
              cell.setAttribute("colspan", "1");
              cell.setAttribute("rowspan", "1");
              cell.setAttribute("style", "border:1px solid #dee0e3;padding:6px 8px;vertical-align:top;");
              const line = document.createElement("div");
              line.className = "ace-line";
              while (cell.firstChild) line.appendChild(cell.firstChild);
              cell.appendChild(line);
            });
          });
        });
        return { html: wrapper.outerHTML };
      }

      function richHtmlDocument(innerHtml) {
        return '<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65;color:#1d2320;}table{border-collapse:collapse;}td{border:1px solid #d9d2c4;padding:6px 9px;}code{background:#f2eee4;padding:1px 4px;border-radius:4px;}pre{background:#f2eee4;padding:10px;border-radius:6px;}blockquote{border-left:3px solid #0d6b57;margin-left:0;padding-left:12px;color:#66706b;}</style></head><body>' + innerHtml + "</body></html>";
      }

      function copyRichFragment(innerHtml) {
        const sandbox = document.createElement("div");
        sandbox.contentEditable = "true";
        sandbox.setAttribute("aria-hidden", "true");
        sandbox.style.position = "fixed";
        sandbox.style.left = "-10000px";
        sandbox.style.top = "0";
        sandbox.style.width = "800px";
        sandbox.innerHTML = innerHtml || feishuPreview.innerHTML;
        document.body.appendChild(sandbox);

        const selection = window.getSelection();
        const range = document.createRange();
        let copied = false;
        try {
          range.selectNodeContents(sandbox);
          selection.removeAllRanges();
          selection.addRange(range);
          copied = document.execCommand("copy");
        } finally {
          selection.removeAllRanges();
          sandbox.remove();
        }
        return copied;
      }

      function setPreviewFromHtml(rawHtml) {
        pastePad.innerHTML = rawHtml || "";
      }

      function setPreviewFromText(text) {
        pastePad.textContent = text || "";
      }

      function updateOutput(markdown, sourceLabel) {
        markdownOutput.value = markdown || "";
        sourceMeta.textContent = sourceLabel || "已转换";
        outputMeta.textContent = (markdownOutput.value.length || 0) + " 字";
        setStatus(markdownOutput.value ? "转换完成。" : "没有可转换内容。", markdownOutput.value ? "" : "warn");
      }

      function updateRichOutput(markdown, sourceLabel) {
        const html = markdownToHtml(markdown);
        feishuPreview.innerHTML = html || "";
        sourceMeta.textContent = sourceLabel || "Markdown 输入";
        outputMeta.textContent = (feishuPreview.innerText || "").length + " 字";
        setStatus(html ? "富文本预览已生成，可复制到飞书。" : "没有可转换内容。", html ? "" : "warn");
      }

      function convertHtml(rawHtml, label) {
        setPreviewFromHtml(rawHtml);
        updateOutput(htmlToMarkdown(rawHtml), label || "HTML");
      }

      function convertText(text, label) {
        setPreviewFromText(text);
        updateOutput(textToMarkdown(text), label || "纯文本");
      }

      function renderMarkdownInput(label) {
        updateRichOutput(markdownInput.value, label || "Markdown 输入");
      }

      function setMode(mode) {
        currentMode = mode;
        document.body.dataset.mode = mode;
        modeButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.mode === mode);
        });

        const toMd = mode === "to-md";
        pastePad.classList.toggle("hidden", !toMd);
        markdownOutput.classList.toggle("hidden", !toMd);
        markdownInput.classList.toggle("hidden", toMd);
        feishuPreview.classList.toggle("hidden", toMd);

        inputMark.textContent = toMd ? "IN" : "MD";
        inputTitle.textContent = toMd ? "飞书粘贴区" : "Markdown 输入区";
        outputMark.textContent = toMd ? "MD" : "FS";
        outputTitle.textContent = toMd ? "Markdown 输出" : "飞书富文本预览";
        readClipboard.textContent = toMd ? "读取剪贴板" : "读取 MD";
        copyButtonLabel.textContent = toMd ? "复制 Markdown" : "复制到飞书";
        copyMarkdown.classList.toggle("feishu-primary", !toMd);
        feishuIcon.classList.toggle("hidden", toMd);
        downloadMarkdown.textContent = toMd ? "下载 .md" : "下载 HTML";
        document.getElementById("dropOverlay").textContent = toMd ? "放开导入 HTML 文件" : "放开导入 Markdown 文件";

        if (!toMd && !markdownInput.value && markdownOutput.value) {
          markdownInput.value = markdownOutput.value;
        }
        if (toMd) {
          outputMeta.textContent = (markdownOutput.value.length || 0) + " 字";
          sourceMeta.textContent = pastePad.textContent ? "HTML 粘贴" : "等待粘贴";
          setStatus("飞书内容粘贴到左侧，右侧生成 Markdown。");
          pastePad.focus();
        } else {
          renderMarkdownInput(markdownInput.value ? "Markdown 输入" : "等待输入");
          markdownInput.focus();
        }
      }

      pastePad.addEventListener("paste", (event) => {
        if (currentMode !== "to-md") return;
        const clipboard = event.clipboardData;
        if (!clipboard) return;
        event.preventDefault();
        const htmlData = clipboard.getData("text/html");
        const textData = clipboard.getData("text/plain");
        if (htmlData) {
          convertHtml(htmlData, "HTML 粘贴");
        } else {
          convertText(textData, "文本粘贴");
        }
      });

      pastePad.addEventListener("input", () => {
        if (currentMode !== "to-md") return;
        const html = pastePad.innerHTML;
        const text = pastePad.textContent || "";
        if (html && html !== text) {
          updateOutput(htmlToMarkdown(html), "手动编辑");
        } else {
          updateOutput(textToMarkdown(text), "手动编辑");
        }
      });

      markdownInput.addEventListener("input", () => {
        if (currentMode !== "to-feishu") return;
        renderMarkdownInput("手动编辑");
      });

      modeButtons.forEach((button) => {
        button.addEventListener("click", () => setMode(button.dataset.mode));
      });

      readClipboard.addEventListener("click", async () => {
        if (currentMode === "to-feishu") {
          if (!navigator.clipboard || !navigator.clipboard.readText) {
            markdownInput.focus();
            setStatus("当前浏览器不支持主动读取文本剪贴板，请在左侧粘贴 Markdown。", "warn");
            return;
          }
          try {
            const text = await navigator.clipboard.readText();
            markdownInput.value = text || "";
            renderMarkdownInput("剪贴板 Markdown");
          } catch (error) {
            markdownInput.focus();
            setStatus("浏览器拒绝读取剪贴板，请在左侧粘贴 Markdown。", "warn");
          }
          return;
        }

        if (!navigator.clipboard || !navigator.clipboard.read) {
          pastePad.focus();
          setStatus("当前浏览器不支持主动读取富文本剪贴板，请在左侧粘贴。", "warn");
          return;
        }
        try {
          const items = await navigator.clipboard.read();
          for (const item of items) {
            if (item.types.includes("text/html")) {
              const blob = await item.getType("text/html");
              convertHtml(await blob.text(), "剪贴板 HTML");
              return;
            }
            if (item.types.includes("text/plain")) {
              const blob = await item.getType("text/plain");
              convertText(await blob.text(), "剪贴板文本");
              return;
            }
          }
          setStatus("剪贴板里没有文本内容。", "warn");
        } catch (error) {
          pastePad.focus();
          setStatus("浏览器拒绝读取剪贴板，请在左侧粘贴。", "warn");
        }
      });

      async function copyRichOutput() {
        if (!feishuPreview.innerHTML.trim()) {
          setStatus("没有可复制的飞书富文本。", "warn");
          return;
        }

        const larkPayload = buildLarkClipboardPayload();
        const fragment = larkPayload ? larkPayload.html : feishuPreview.innerHTML;
        const html = richHtmlDocument(fragment);
        const plain = feishuPreview.innerText || "";
        try {
          if (!navigator.clipboard || !window.ClipboardItem) throw new Error("rich clipboard unsupported");
          const clipboardData = {
            "text/html": new Blob([html], { type: "text/html" }),
            "text/plain": new Blob([plain], { type: "text/plain" })
          };
          await navigator.clipboard.write([
            new ClipboardItem(clipboardData)
          ]);
          setStatus(larkPayload ? "已复制为飞书原生简易表格，可直接粘贴。" : "飞书富文本已复制，可直接粘贴到飞书。");
        } catch (error) {
          if (navigator.clipboard && window.ClipboardItem) {
            try {
              await navigator.clipboard.write([
                new ClipboardItem({
                  "text/html": new Blob([html], { type: "text/html" }),
                  "text/plain": new Blob([plain], { type: "text/plain" })
                })
              ]);
              setStatus(larkPayload ? "已复制飞书表格；若未显示为简易表格，请使用最新版 Chrome 或 Edge。" : "飞书富文本已复制，可直接粘贴到飞书。", larkPayload ? "warn" : "");
              return;
            } catch (fallbackError) {
              // Continue to the selection-based compatibility fallback.
            }
          }
          const ok = copyRichFragment(fragment);
          setStatus(ok ? (larkPayload ? "已复制飞书表格；若未显示为简易表格，请使用最新版 Chrome 或 Edge。" : "飞书富文本已复制，可直接粘贴到飞书。") : "复制失败，请手动选中右侧预览复制。", ok && !larkPayload ? "" : "warn");
        }
      }

      copyMarkdown.addEventListener("click", async () => {
        if (currentMode === "to-feishu") {
          await copyRichOutput();
          return;
        }
        if (!markdownOutput.value) {
          setStatus("没有可复制的 Markdown。", "warn");
          return;
        }
        try {
          await navigator.clipboard.writeText(markdownOutput.value);
          setStatus("Markdown 已复制。");
        } catch (error) {
          markdownOutput.focus();
          markdownOutput.select();
          const ok = document.execCommand("copy");
          setStatus(ok ? "Markdown 已复制。" : "复制失败，请手动复制。", ok ? "" : "warn");
        }
      });

      downloadMarkdown.addEventListener("click", () => {
        if (currentMode === "to-feishu") {
          if (!feishuPreview.innerHTML.trim()) {
            setStatus("没有可下载的 HTML。", "warn");
            return;
          }
          const now = new Date();
          const stamp = [
            now.getFullYear(),
            String(now.getMonth() + 1).padStart(2, "0"),
            String(now.getDate()).padStart(2, "0"),
            "-",
            String(now.getHours()).padStart(2, "0"),
            String(now.getMinutes()).padStart(2, "0")
          ].join("");
          const blob = new Blob([richHtmlDocument(feishuPreview.innerHTML)], { type: "text/html;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "Markdown转飞书富文本-" + stamp + ".html";
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
          setStatus("HTML 文件已生成。");
          return;
        }

        if (!markdownOutput.value) {
          setStatus("没有可下载的 Markdown。", "warn");
          return;
        }
        const now = new Date();
        const stamp = [
          now.getFullYear(),
          String(now.getMonth() + 1).padStart(2, "0"),
          String(now.getDate()).padStart(2, "0"),
          "-",
          String(now.getHours()).padStart(2, "0"),
          String(now.getMinutes()).padStart(2, "0")
        ].join("");
        const blob = new Blob([markdownOutput.value], { type: "text/markdown;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "飞书文档转换-" + stamp + ".md";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        setStatus("Markdown 文件已生成。");
      });

      clearAll.addEventListener("click", () => {
        pastePad.innerHTML = "";
        markdownInput.value = "";
        markdownOutput.value = "";
        feishuPreview.innerHTML = "";
        sourceMeta.textContent = "等待粘贴";
        outputMeta.textContent = "0 字";
        setStatus("已清空。");
        (currentMode === "to-md" ? pastePad : markdownInput).focus();
      });

      document.addEventListener("dragover", (event) => {
        event.preventDefault();
        document.body.classList.add("dragging");
      });

      document.addEventListener("dragleave", (event) => {
        if (event.clientX <= 0 || event.clientY <= 0 || event.clientX >= window.innerWidth || event.clientY >= window.innerHeight) {
          document.body.classList.remove("dragging");
        }
      });

      document.addEventListener("drop", async (event) => {
        event.preventDefault();
        document.body.classList.remove("dragging");
        const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
        if (!file) return;
        const text = await file.text();
        if (/\.md|\.markdown|\.txt$/i.test(file.name) && currentMode === "to-feishu") {
          markdownInput.value = text;
          renderMarkdownInput("Markdown 文件");
        } else if (/\.md|\.markdown$/i.test(file.name)) {
          setMode("to-feishu");
          markdownInput.value = text;
          renderMarkdownInput("Markdown 文件");
        } else if (/\.html?$/i.test(file.name) || /<html|<body|<p|<h[1-6]|<table|<ul|<ol/i.test(text)) {
          setMode("to-md");
          convertHtml(text, "HTML 文件");
        } else {
          if (currentMode === "to-feishu") {
            markdownInput.value = text;
            renderMarkdownInput("文本文件");
          } else {
            convertText(text, "文本文件");
          }
        }
      });

      setMode("to-feishu");
    })();
  </script>
</body>
</html>
